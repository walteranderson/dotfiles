# enable mouse control
set -g mouse on
# 12-hour clock
set -g clock-mode-style 12
# increase the max character length of the left-side status line (so you can have a longer session name)
set -g status-left-length 20
# increase history limit
set -g history-limit 10000
# get rid of the activity bell
set -g visual-activity off
set -g visual-bell off
set -g visual-silence off
set -g monitor-activity off
set -g bell-action none
# don't rename windows automatically
set -g allow-rename off
# remove bg from status bar
set -g status-style bg=default
# highlight the currently active tab
set -g window-status-current-style reverse
# remove styling from active window (default value is reverse, which is what the current-style is being set to now)
set -g window-status-activity-style "none"
# status bar
set -g status-left ' [#{session_name}] :: '
set -g status-right '%r :: %F '
# reduce amount of time tmux waits after an escape key is pressed to determine if it is part of a key sequence. 
# suggestion from neovim
set -sg escape-time 10
# enables sending focus events to anything running within a tmux session
# suggestion from neovim
set -g focus-events on

# remap prefix to ctrl-a
unbind C-b
set -g prefix C-a
bind-key C-a send-prefix

# remap split panes
bind | split-window -h
bind - split-window -v
unbind '"'
unbind %

# remap to switch between the last two windows
bind-key C-a last-window
bind-key 'a' last-pane

# remap reload tmux config
bind r source-file ~/.config/tmux/tmux.conf

# remap kill session
bind-key \\ confirm-before -p "Kill session #S?" kill-session

# remap rename session
bind-key g command-prompt "rename-session %%"

bind-key f display-popup -E "tms"

# border colos
set -g pane-border-style fg=white
set -g pane-active-border-style "bg=default fg=white"

# Don't leave copy-mode after copying - both via mouse and keyboard
bind-key -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-selection-no-clear
bind-key -T copy-mode-vi Enter send-keys -X copy-selection-no-clear
bind-key -T copy-mode-vi y send-keys -X copy-selection-no-clear

# https://code.claude.com/docs/en/terminal-config#configure-tmux
set -g allow-passthrough on
set -s extended-keys on
set -as terminal-features 'xterm*:extkeys'

bind -n C-h if -F '#{@pane-is-vim}' { send-keys C-h } { if -F '#{pane_at_left}'   { split-window -hb -c "#{pane_current_path}" } { select-pane -L } }
bind -n C-j if -F '#{@pane-is-vim}' { send-keys C-j } { if -F '#{pane_at_bottom}' { split-window -v  -c "#{pane_current_path}" } { select-pane -D } }
bind -n C-k if -F '#{@pane-is-vim}' { send-keys C-k } { if -F '#{pane_at_top}'    { split-window -vb -c "#{pane_current_path}" } { select-pane -U } }
bind -n C-l if -F '#{@pane-is-vim}' { send-keys C-l } { if -F '#{pane_at_right}'  { split-window -h  -c "#{pane_current_path}" } { select-pane -R } }

bind -n M-h if -F '#{@pane-is-vim}' { send-keys M-h } { resize-pane -L 3 }
bind -n M-j if -F '#{@pane-is-vim}' { send-keys M-j } { resize-pane -D 3 }
bind -n M-k if -F '#{@pane-is-vim}' { send-keys M-k } { resize-pane -U 3 }
bind -n M-l if -F '#{@pane-is-vim}' { send-keys M-l } { resize-pane -R 3 }

bind -T copy-mode-vi C-h if -F '#{pane_at_left}'   '' 'select-pane -L'
bind -T copy-mode-vi C-j if -F '#{pane_at_bottom}' '' 'select-pane -D'
bind -T copy-mode-vi C-k if -F '#{pane_at_top}'    '' 'select-pane -U'
bind -T copy-mode-vi C-l if -F '#{pane_at_right}'  '' 'select-pane -R'
